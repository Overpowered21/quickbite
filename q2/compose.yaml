x-python-service: &python-service
  image: quickbite-q2-python:local
  build:
    context: .
  environment:
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MODEL_NAME: iris-classifier

services:
  mlflow:
    <<: *python-service
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --default-artifact-root
      - mlflow-artifacts:/
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  train:
    <<: *python-service
    command: ["python", "train.py"]
    depends_on:
      mlflow:
        condition: service_healthy

  model-service:
    <<: *python-service
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      train:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.3.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      model-service:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: q2-admin
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/q2.yml:ro
      - ./monitoring/dashboards.yml:/etc/grafana/provisioning/dashboards/q2.yml:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/q2.json:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:
